<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>PKCE + Keycloak + Refresh</title>
  <style>
    body { font-family: sans-serif; padding: 2em; }
    #user-box { display: none; }
    #login-box { display: none; }
  </style>
</head>
<body>
  <div id="login-box">
    <button id="loginBtn">Войти</button>
  </div>

  <div id="user-box">
    <h2>Вы вошли!</h2>
    <pre id="token-info"></pre>
    <button onclick="logout()">Выйти</button>
  </div>

  <script>
    const clientId = "alltype";
    const realm = "rtc";
    const redirectUri = "http://localhost:8001/frontend/callback.html";
    const keycloakBase = "https://dedup-gpn.ru/auth";

    function generateCodeVerifier() {
      const array = new Uint8Array(64);
      crypto.getRandomValues(array);
      return btoa(String.fromCharCode(...array)).replace(/[^a-zA-Z0-9]/g, '').slice(0, 128);
    }

    async function generateCodeChallenge(verifier) {
      const data = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    async function login() {
      const verifier = generateCodeVerifier();
      sessionStorage.setItem("pkce_code_verifier", verifier);
      const challenge = await generateCodeChallenge(verifier);

      const url = `${keycloakBase}/realms/${realm}/protocol/openid-connect/auth?client_id=${clientId}&response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&scope=openid&code_challenge=${challenge}&code_challenge_method=S256`;

      window.open(url, "keycloak-login", "width=500,height=600");
    }

    window.addEventListener("message", async (event) => {
      const { code } = event.data;
      if (!code) return;

      const verifier = sessionStorage.getItem("pkce_code_verifier");

      const params = new URLSearchParams();
      params.append("grant_type", "authorization_code");
      params.append("client_id", clientId);
      params.append("code", code);
      params.append("redirect_uri", redirectUri);
      params.append("code_verifier", verifier);

      const res = await fetch(`${keycloakBase}/realms/${realm}/protocol/openid-connect/token`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params
      });

      const text = await res.text();
      if (!res.ok) {
        console.error("Ошибка входа:", text);
        alert("Ошибка входа");
        return;
      }

      const data = JSON.parse(text);
      const auth = {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Date.now() + data.expires_in * 1000
      };
      localStorage.setItem("auth", JSON.stringify(auth));
      showUser(auth.access_token);
    });

    async function tryRefresh(refreshToken) {
      const params = new URLSearchParams();
      params.append("grant_type", "refresh_token");
      params.append("client_id", clientId);
      params.append("refresh_token", refreshToken);

      const res = await fetch(`${keycloakBase}/realms/${realm}/protocol/openid-connect/token`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params
      });

      const text = await res.text();
      if (!res.ok) {
        console.warn("Не удалось обновить токен:", text);
        logout();
        return;
      }

      const data = JSON.parse(text);
      const auth = {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Date.now() + data.expires_in * 1000
      };
      localStorage.setItem("auth", JSON.stringify(auth));
      showUser(auth.access_token);
    }

    function showUser(token) {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("user-box").style.display = "block";
      document.getElementById("token-info").innerText = token;
    }

    function logout() {
      localStorage.removeItem("auth");
      location.reload();
    }

    window.onload = () => {
      const raw = localStorage.getItem("auth");
      if (raw) {
        const auth = JSON.parse(raw);
        if (Date.now() < auth.expires_at) {
          showUser(auth.access_token);
        } else {
          tryRefresh(auth.refresh_token);
        }
      } else {
        document.getElementById("login-box").style.display = "block";
      }
      document.getElementById("loginBtn").onclick = login;
    };
  </script>
</body>
</html>
